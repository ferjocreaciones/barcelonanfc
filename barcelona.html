<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Barcelona NFC</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #0A0A0A, #001f3f);
    color: white;
    text-align: center;
}

.container {
    padding: 20px;
}

.card-fc {
    position: relative;
    width: 90%;
    max-width: 320px;
    height: 480px;
    margin: 20px auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(200,16,46,0.7);
}

.card-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background:
        linear-gradient(135deg, rgba(165,0,68,0.9), rgba(0,77,152,0.9)),
        repeating-linear-gradient(
            45deg,
            #A50044,
            #A50044 20px,
            #004D98 20px,
            #004D98 40px
        );
    z-index: 1;
}

.card-player {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-height: 320px;
    object-fit: contain;
    z-index: 2;
}

.card-info {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 15px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.8));
    z-index: 3;
}

.card-name {
    font-size: 20px;
    font-weight: bold;
}

.card-details {
    display: flex;
    justify-content: center;
    gap: 15px;
    font-size: 16px;
    margin-top: 5px;
}

.card-details span {
    background: rgba(0,0,0,0.6);
    padding: 4px 10px;
    border-radius: 8px;
}

/* BOTONES */
.btn {
    display: block;
    margin: 10px auto;
    padding: 15px;
    width: 90%;
    max-width: 400px;
    background: #004D98;
    color: white;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
}

.btn:hover {
    background: #003366;
}

/* PREMIUM */
.btn-premium {
    display: block;
    width: 90%;
    max-width: 320px;
    margin: 25px auto;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    color: #111;
    text-decoration: none;
    border-radius: 15px;

    background: linear-gradient(135deg,#FFD700,#FFC300,#FFB300,#FFD700);
}

.separador {
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #A50044, #004D98);
    margin: 25px 0;
}
</style>
</head>

<body>

const params = new URLSearchParams(window.location.search);
const jugador = params.get("jugador");

if (jugadores[jugador]) {

}
